name: Chronos-Guard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Unit & Integration Tests
        run: go test -v ./internal/...

      - name: Compile Sidecar Server Binary
        run: go build -v -o bin/sidecar ./cmd/server/main.go

      - name: Compile Mock Client Binary
        run: go build -v -o bin/client_mock ./cmd/client_mock/main.go