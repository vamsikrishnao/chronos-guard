apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-runtime
  namespace: production
  labels:
    app.kubernetes.io/name: ai-agent-runtime
    app.kubernetes.io/part-of: chronos-guard-mesh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-agent-runtime
  template:
    metadata:
      labels:
      app: ai-agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        # Primary Application Container (AI Agent Worker)
        - name: agent-worker
          image: internal-registry.io/platform/ai-agent-worker:v1.4.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http-metrics
          env:
            - name: CHRONOS_GUARD_ENDPOINT
              value: "localhost:50051"
          resources:
            limits:
              cpu: "2000m"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi

        # Chronos-Guard Sidecar Proxy
        - name: chronos-guard-proxy
          image: internal-registry.io/security/chronos-guard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc-guard
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Native gRPC Probes for Reliable Lifecycle Management
          startupProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10

          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3